# Merge these fields into a Mini-Agent configuration. Tool names depend on the
# operator's MCP setup; this example does not create web access by itself.
tools:
  enable_file_tools: true
  enable_bash: true
  enable_note: true
  enable_skills: true
  skills_dir: "./skills"
  enable_mcp: true
  mcp_config_path: "mcp.json"
