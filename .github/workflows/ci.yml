name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile helpers
        run: python -m compileall -q scripts tests
      - name: Run unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Validate forward-evaluation coverage
        run: python scripts/eval_catalog.py evals/cases.json --strict
      - name: Exercise evaluation-result validation
        run: python -m unittest tests.test_eval_results -v
      - name: Smoke-test plan preview
        run: python scripts/plan_preview.py --topic "test topic" --json
