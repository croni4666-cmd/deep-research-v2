name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile helpers
        run: python -m compileall -q scripts tests
      - name: Run unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Validate forward-evaluation coverage
        run: python scripts/eval_catalog.py evals/cases.json --strict
      - name: Validate evaluation suites and isolation declarations
        run: python scripts/eval_suites.py evals/suites.json
      - name: Exercise evaluation-result validation
        run: python -m unittest tests.test_eval_results -v
      - name: Exercise raw-output metric extraction
        run: python -m unittest tests.test_eval_ingest -v
      - name: Exercise independent review and adjudication
        run: python -m unittest tests.test_eval_review -v
      - name: Exercise matrix completion gates
        run: python -m unittest tests.test_eval_status -v
      - name: Validate release metadata
        run: python scripts/release_check.py --expected-version 2.6.1
      - name: Smoke-test plan preview
        run: python scripts/plan_preview.py --topic "test topic" --json
      - name: Smoke-test portable packages
        run: |
          python scripts/package_skill.py --target codex --output "$RUNNER_TEMP/codex-package"
          python scripts/package_skill.py --target minimax --output "$RUNNER_TEMP/minimax-package"
